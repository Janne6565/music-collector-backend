spring:
  application:
    name: music-collector-backend
  servlet:
    multipart:
      # Slightly above the app's own limit, so an oversized upload is rejected by the
      # service with a clear message rather than by the container with a generic one.
      max-file-size: 16MB
      max-request-size: 16MB
  datasource:
    url: ${MC_DB_URL:jdbc:postgresql://localhost:5432/musiccollector}
    username: ${MC_DB_USER:musiccollector}
    password: ${MC_DB_PASSWORD:musiccollector}
  jpa:
    hibernate:
      # Schema is owned by Flyway. Never raise this above `validate` in any environment.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      # RFC 7807 for framework-raised errors too, not just BaseException.
      enabled: true

music-collector:
  jwt:
    # No fallback on purpose: the app must fail to start rather than run on a known secret.
    secret: ${MC_JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  auth:
    # Off only for local HTTP development.
    cookie-secure: ${MC_COOKIE_SECURE:true}
    attempts-per-hour: 20
  storage:
    endpoint: ${MC_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MC_MINIO_ACCESS_KEY:musiccollector}
    secret-key: ${MC_MINIO_SECRET_KEY:musiccollector-secret}
    bucket: ${MC_MINIO_BUCKET:music-collector-photos}
    # A phone photo is a couple of megabytes; 15 leaves room for a large one without
    # letting the endpoint be used as free object storage.
    max-upload-bytes: 15728640
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    cover-art-base-url: https://coverartarchive.org
    # MusicBrainz requires a descriptive, contactable User-Agent and caps callers at 1 req/s.
    user-agent: ${MC_MUSICBRAINZ_USER_AGENT:MusicCollector/0.1 (https://github.com/Janne6565/music-collector-backend)}
    requests-per-second: 1
    # Per-IP quota for the open metadata proxy.
    anonymous-requests-per-minute: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.musiccollector: DEBUG
